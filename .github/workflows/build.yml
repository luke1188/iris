name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: live_visualizer-windows-x64
            binary: live_visualizer.exe
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            artifact: live_visualizer-macos-aarch64
            binary: live_visualizer
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            artifact: live_visualizer-macos-x64
            binary: live_visualizer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp -R presets "$staging/presets"
          if [ -d assets ]; then
            cp -R assets "$staging/assets"
          fi
          if [ -f README.md ]; then
            cp README.md "$staging/"
          fi
          if [ -f docs/WINDOWS.md ]; then
            mkdir -p "$staging/docs"
            cp docs/WINDOWS.md "$staging/docs/"
          fi
          (
            cd dist
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              7z a -tzip "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
            else
              zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
            fi
          )
          ls -la "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten zips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
