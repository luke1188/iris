name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: iris_visualizer-windows-x64
            binary: iris_visualizer.exe
            kind: windows
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            artifact: iris_visualizer-macos-aarch64
            binary: iris_visualizer
            kind: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Portable folder — no .app / codesign yet (signing keys TBD).
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "$bin" ]; then
            echo "Missing binary at $bin"
            ls -la "target/${{ matrix.target }}/release/" || true
            exit 1
          fi
          staging="dist/${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "$bin" "$staging/"
          chmod +x "$staging/${{ matrix.binary }}" || true
          if [ -f README.md ]; then
            cp README.md "$staging/"
          fi
          if [[ "${{ matrix.kind }}" == "macos" ]]; then
            cat > "$staging/RUN-MACOS.txt" <<'EOF'
Iris Visualizer — macOS (Apple Silicon) portable build
======================================================

No .app bundle yet (code signing / notarization coming later).

1. Unzip this folder somewhere permanent (not Downloads-only).
2. In Terminal:

   cd /path/to/iris_visualizer-macos-aarch64
   xattr -cr iris_visualizer
   chmod +x iris_visualizer
   ./iris_visualizer

If Gatekeeper blocks it: System Settings → Privacy & Security → allow,
or right-click the binary → Open (after xattr).

Presets / icons are baked into the binary.
EOF
          fi
          ls -la "$staging"
          file "$staging/${{ matrix.binary }}" || true

      # Upload the folder (Actions wraps it once for download).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error

      - name: Zip for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          (cd dist && zip -r "release/${{ matrix.artifact }}.zip" "${{ matrix.artifact }}")
          ls -la dist/release

      - name: Upload release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release
          path: dist/release/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true

      - run: ls -laR release

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release/*.zip
          body: |
            ## Downloads
            - **Windows:** unzip → run `iris_visualizer.exe`
            - **macOS (Apple Silicon):** unzip → see `RUN-MACOS.txt`
              ```bash
              xattr -cr iris_visualizer && chmod +x iris_visualizer && ./iris_visualizer
              ```
              Portable binary for now (no signed `.app` until Developer ID is set up).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
