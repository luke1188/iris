name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: iris_visualizer-windows-x64
            binary: iris_visualizer.exe
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: iris_visualizer-macos-aarch64
            binary: iris_visualizer

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Portable folder (no macOS .app / codesign yet).
      # Do not zip here — Windows Git Bash has no `zip` binary.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "$bin" ]; then
            echo "Missing binary at $bin"
            ls -la "target/${{ matrix.target }}/release/" || true
            exit 1
          fi

          staging="dist/${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "$bin" "$staging/"
          chmod +x "$staging/${{ matrix.binary }}" || true

          if [ -f README.md ]; then
            cp README.md "$staging/"
          fi
          if [ -d presets ]; then
            cp -R presets "$staging/presets"
          fi
          if [ -d assets ]; then
            cp -R assets "$staging/assets"
          fi
          if [ -d docs ] && [ "$(ls -A docs 2>/dev/null || true)" ]; then
            cp -R docs "$staging/docs"
          fi

          echo "--- package contents ---"
          find "$staging" -type f | sort
          file "$staging/${{ matrix.binary }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip packages
        run: |
          set -euo pipefail
          mkdir -p release
          ls -laR artifacts
          for dir in artifacts/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
