[package]
name = "iris_visualizer"
version = "0.1.0"
edition = "2021"
description = "Iris Visualizer — real-time DJ music visualizer for Windows"
authors = ["Iris Visualizer"]
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = "0.29"
cpal = "0.15"
rustfft = "6.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
image = "0.25"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
